<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page introuvable — Actu ASVEL</title>
  <meta name="description" content="La page demandée n’existe pas ou a été déplacée. Retour à l’accueil d’Actu ASVEL.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{height:100%}
    body{
      min-height:100%;
      display:grid;
      place-items:center;
      background:#050505;
      color:#fff;
      font-family:'Source Sans 3',Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow:hidden;
    }
    .halo{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 50% 38%,rgba(201,164,77,.10),transparent 42%),
        radial-gradient(circle at 50% 105%,rgba(201,164,77,.05),transparent 55%);
    }
    .wrap{position:relative;z-index:1;width:min(680px,90%);text-align:center;padding:2.5rem 0}
    .brand{
      display:inline-flex;
      align-items:center;
      font-family:'Archivo Black',Arial,sans-serif;
      font-size:1.05rem;
      letter-spacing:-.035em;
      text-transform:uppercase;
    }
    .brand:before{
      content:'';
      width:34px;height:4px;background:#c9a44d;margin-right:.8rem;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      margin-top:2.2rem;
      border:1px solid rgba(201,164,77,.55);
      padding:.45rem .85rem;
      color:#e2c675;
      font-family:'Oswald',Arial,sans-serif;
      font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    }
    h1{
      margin-top:1.3rem;
      font-family:'Archivo Black',Arial,sans-serif;
      font-size:clamp(2.3rem,7vw,4.4rem);
      line-height:.95;
      letter-spacing:-.05em;
      text-transform:uppercase;
      text-wrap:balance;
    }
    p.lead{
      max-width:520px;
      margin:1.15rem auto 0;
      color:#b9b6ae;
      font-size:1rem;line-height:1.65;
    }
    a.home{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      margin-top:2rem;
      padding:.9rem 1.7rem;
      background:#c9a44d;
      color:#0b0b09;
      font-family:'Oswald',Arial,sans-serif;
      font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
      text-decoration:none;
      transition:background .2s ease,transform .2s ease;
    }
    a.home:hover{background:#e2c675;transform:translateY(-2px)}
    footer{
      position:fixed;left:0;right:0;bottom:0;z-index:1;
      padding:1.1rem 1.4rem;text-align:center;
      color:#6f6b63;font-size:.78rem;line-height:1.5;
    }
    footer strong{font-family:'Archivo Black',Arial,sans-serif;color:#e2c675;font-size:.82rem}
    @media(prefers-reduced-motion:reduce){a.home{transition:none}}
  </style>
</head>
<body>
  <div class="halo" aria-hidden="true"></div>
  <main class="wrap">
    <span class="brand">ACTU ASVEL</span>
    <span class="badge">Erreur 404</span>
    <h1>Page introuvable</h1>
    <p class="lead">La page que vous cherchez n’existe pas ou a été déplacée.</p>
    <a class="home" href="index.html">Retour à l’accueil</a>
  </main>
  <footer><strong>ACTU ASVEL</strong> — Média indépendant consacré à l’actualité de l’ASVEL, non affilié au club. · © 2026</footer>
</body>
</html>
