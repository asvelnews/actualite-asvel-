<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Maintenance du site — Actu ASVEL</title>
  <style>
    :root{--gold:#c9a44d;--black:#050505;--white:#f7f5ef}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--black);color:var(--white);font-family:Arial,Helvetica,sans-serif}
    body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 75% 20%,rgba(201,164,77,.14),transparent 30%),radial-gradient(circle at 15% 85%,rgba(255,255,255,.06),transparent 27%);pointer-events:none}
    .frame{position:fixed;inset:18px;border:1px solid rgba(201,164,77,.28);pointer-events:none}
    main{position:relative;width:min(880px,calc(100% - 40px));padding:64px 24px;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:12px;font-size:.76rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
    .brand:before,.brand:after{content:"";width:34px;height:1px;background:var(--gold)}
    h1{max-width:850px;margin:34px auto 0;font-size:clamp(2.25rem,8vw,6.5rem);line-height:.88;letter-spacing:-.065em;text-transform:uppercase}
    h1 span{display:block;color:var(--gold)}
    p{max-width:590px;margin:28px auto 0;color:#aaa;font-size:clamp(.95rem,2vw,1.1rem);line-height:1.65}
    .status{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:12px 16px;border:1px solid #2b2b2b;color:#ddd;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(201,164,77,.6);animation:pulse 1.8s infinite}
    footer{position:fixed;left:24px;right:24px;bottom:34px;display:flex;justify-content:space-between;gap:20px;color:#666;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase}
    @keyframes pulse{70%{box-shadow:0 0 0 10px rgba(201,164,77,0)}100%{box-shadow:0 0 0 0 rgba(201,164,77,0)}}
    @media(max-width:560px){.frame{inset:10px}main{width:calc(100% - 24px);padding:40px 12px}h1{font-size:clamp(2rem,13vw,3.35rem);line-height:.92;letter-spacing:-.045em}.brand:before,.brand:after{width:20px}footer{left:20px;right:20px;bottom:24px;justify-content:center;text-align:center}footer span:last-child{display:none}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
</head>
<body>
  <div class="frame"></div>
  <main>
    <div class="brand">Actu ASVEL</div>
    <h1>Maintenance <span>du site</span></h1>
    <p>Une nouvelle interface est en préparation. Nous travaillons actuellement pour vous proposer une expérience plus moderne, plus rapide et entièrement pensée pour l’actualité villeurbannaise.</p>
    <div class="status"><span class="dot"></span>Refonte en cours</div>
  </main>
  <footer><span>Actu ASVEL © 2026</span><span>Média indépendant consacré à l’ASVEL</span></footer>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"775ee7d0d68047bfb7614f6b49ac9787"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
